name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Start API (requires nestjs-fsd-template checkout)
        run: |
          echo "E2E against API is documented in README."
          echo "Run locally: docker compose in nestjs-fsd-template, then npm run test:e2e"

      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1

      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
          E2E_ADMIN_EMAIL: admin@example.com
          E2E_ADMIN_PASSWORD: Admin123!
